name: CI

# Roda em todo push, em qualquer branch. O merge em homolog e em production
# também é um push, então o mesmo CI roda antes do deploy.
on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  # Push novo cancela o anterior na mesma branch, menos em homolog e production (deploy)
  cancel-in-progress: ${{ github.ref != 'refs/heads/homolog' && github.ref != 'refs/heads/production' }}

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: klass-io/.github/.github/workflows/node-ci.yml@main
    # with:
    #   migrations-check: true   # só na API

