# CI central dos repositórios Node do Klass (API, apps e lib-klass-design).
# Cada repositório chama este arquivo pelo seu .github/workflows/ci.yml.
name: Node CI

on:
  workflow_call:
    inputs:
      typecheck:
        description: Roda pnpm typecheck
        type: boolean
        default: true
      build:
        description: Roda pnpm build
        type: boolean
        default: true
      migrations-check:
        description: Roda pnpm db:check-migrations (só a API)
        type: boolean
        default: false

jobs:
  commitlint:
    name: Commits (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Versão do pnpm vem do campo packageManager do package.json
      - uses: pnpm/action-setup@v4

      # Registro do GitHub Packages para instalar o @klass/design
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@klass"

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm lint

      - if: inputs.typecheck
        run: pnpm typecheck

      - run: pnpm test

      - if: inputs.build
        run: pnpm build

      - if: inputs.migrations-check
        run: pnpm db:check-migrations
