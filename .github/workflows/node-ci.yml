# CI central dos repositórios Node do Klass (API, apps e lib-klass-design).
# Cada repositório chama este arquivo pelo seu .github/workflows/ci.yml.
name: Node CI

on:
  workflow_call:
    inputs:
      typecheck:
        description: Roda pnpm typecheck
        type: boolean
        default: true
      build:
        description: Roda pnpm build
        type: boolean
        default: true
      migrations-check:
        description: Roda pnpm db:check-migrations (só a API)
        type: boolean
        default: false

# Mínimo necessário: ler o código e instalar pacotes do GitHub Packages.
permissions:
  contents: read
  packages: read

jobs:
  commitlint:
    name: Commits (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Versão do pnpm vem do campo packageManager do package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Registro do GitHub Packages para instalar o @klass/design
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@klass"

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm lint

      - if: inputs.typecheck
        run: pnpm typecheck

      - run: pnpm test

      - if: inputs.build
        run: pnpm build

      - if: inputs.migrations-check
        run: pnpm db:check-migrations
