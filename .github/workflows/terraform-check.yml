# Checagem central do Terraform (tool-klass-infra): formato e validação, sem credenciais.
# O plan no PR e o apply depois do merge ficam no próprio tool-klass-infra, que tem os secrets.
name: Terraform check

on:
  workflow_call:

jobs:
  check:
    name: Formato e validação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
